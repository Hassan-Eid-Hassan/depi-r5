name: reusable workflow for java app

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
    - name: echo environment
      run: echo ${{ vars.ENVIRO_NAME }}

    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup java version 11
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Java App
      run: |
        java --version
        mvn package install -DskipTests

    - name: Test Java App
      run: mvn test

    - name: Build Docker Image
      run: docker build -t ${{ inputs.image-name }}:v${{ github.run_number }} .

    - name: Docker Login
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWD }}

    - name: Push Docker Image
      run: docker push ${{ inputs.image-name }}:v${{ github.run_number }}

    - name: checkout CD Repo
      uses: actions/checkout@v7
      with:
        repository: Hassan-Eid-Hassan/java-app-cd
        path: cdRepo
        # token: ${{ secrets.CD_REPO_TOKEN }}

    - name: Update image tag in the deployment
      run: |
        sed -i "s#.*image: .*#        image: ${{ inputs.image-name }}:v${{ github.run_number }}#" cdRepo/deployment.yaml

    - name: Commit and push the changes
      run: |
        cd cdRepo
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add .
        git commit -m "Update image tag in the deployment to v${{ github.run_number }}"
        git push