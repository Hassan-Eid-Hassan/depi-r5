name: reusable workflow for java app

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
    - name: echo environment
      run: echo ${{ vars.ENVIRO_NAME }}

    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup java version 11
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: depijava-${{ runner.os }}-${{ hashFile('**/pom.xml') }}
        restore-keys: depijava-${{ runner.os }}-

    - name: Build Java App
      run: |
        java --version
        mvn package install -DskipTests

    - name: Test Java App
      run: mvn test

    - name: Build Docker Image
      run: docker build -t ${{ inputs.image-name }}:v${{ github.run_number }} .