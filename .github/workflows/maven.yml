name: Java CICD

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: 'java'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup java version 11
      uses: actions/setup-java@v6
      with:
        distribution: 'oracle'
        java-version: '11'

    - name: Build Java App
      run: mvn package install -DskipTests

    - name: Test Java App
      run: mvn test

    - name: Build Docker Image
      run: docker build -t ${{ vars.IMAGE_NAME }}:v${{ GITHUB_RUN_NUMBER }} .

    - name: Docker Login
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWD }}

    - name: Push Docker Image
      run: docker push ${{ vars.IMAGE_NAME }}:v${{ GITHUB_RUN_NUMBER }}